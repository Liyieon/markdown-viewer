<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A clean Markdown viewer and editor: live preview, visual formatting, adjustable typography.">
<title>Markdown Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#ECEEF1; --chrome:#F6F7F9; --sheet:#FFFFFF; --ink:#1C1F25; --muted:#5F6673;
  --line:#D5D9E0; --line-soft:#E6E9ED; --accent:#BDC0BA; --accent-ink:#1C1F25; --accent-text:#5C6059; --accent-soft:#EEEFEC;
  --mark:#FFF1B8; --code-bg:#F1F3F5; --grid:rgba(120,124,116,.18); --shadow:0 1px 2px rgba(28,31,37,.06),0 8px 28px rgba(28,31,37,.07);
  --ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans TC",monospace;
  --read-font:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --fs:18px; --lh:1.85; --measure:34; --para:.9; --indent:0em; --align:left;
  --h1:2.0736em; --h2:1.728em; --h3:1.44em; --h4:1.2em;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121417; --chrome:#181B1F; --sheet:#1D2025; --ink:#E4E6EA; --muted:#9AA1AC;
    --line:#30353D; --line-soft:#262A31; --accent:#BDC0BA; --accent-ink:#1C1F25; --accent-text:#C9CCC6; --accent-soft:#2B2E2A;
    --mark:#574813; --code-bg:#262A31; --grid:rgba(189,192,186,.12); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121417; --chrome:#181B1F; --sheet:#1D2025; --ink:#E4E6EA; --muted:#9AA1AC;
  --line:#30353D; --line-soft:#262A31; --accent:#BDC0BA; --accent-ink:#1C1F25; --accent-text:#C9CCC6; --accent-soft:#2B2E2A;
  --mark:#574813; --code-bg:#262A31; --grid:rgba(189,192,186,.12); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:"Noto Serif TC",serif;font-weight:700;font-size:18px;letter-spacing:.01em;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand small{font-family:var(--ui);font-weight:400;font-size:12px;letter-spacing:0;color:var(--muted)}
.filename{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 160px}
.filename input{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;min-width:0;width:100%;max-width:280px;font-weight:500}
.filename input:hover{border-color:var(--line)}
.filename input:focus{border-color:var(--accent-text);background:var(--sheet);outline:none}
.dirty{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.seg{display:inline-flex;background:var(--line-soft);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);min-height:30px}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:5px 11px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.btn svg{width:15px;height:15px;flex:none}

/* ---------- format bar ---------- */
.fmtbar{display:flex;align-items:center;gap:2px;padding:6px 12px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.fmtbar::-webkit-scrollbar{display:none}
.fmtbar .sep{width:1px;height:18px;background:var(--line);margin:0 6px;flex:none}
.fbtn{border:0;background:transparent;min-width:32px;height:32px;padding:0 7px;border-radius:6px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.fbtn:hover{background:var(--line-soft)}
.fbtn svg{width:16px;height:16px}
.fbtn .t{font-family:"Noto Serif TC",serif;font-weight:700}
.target{margin-left:auto;padding-left:12px;color:var(--muted);font-size:12px;white-space:nowrap;flex:none}
.target b{color:var(--accent-text);font-weight:500}

/* ---------- workspace ---------- */
.work{flex:1;display:flex;min-height:0}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.editor-pane{flex:1;background:var(--sheet);border-right:1px solid var(--line)}
.app[data-view="source"] .editor-pane{border-right:0}
#src{flex:1;border:0;resize:none;padding:28px max(16px,4%) 40vh;background:transparent;font:13.5px/1.75 var(--mono);tab-size:2;outline:none;color:var(--ink)}
#src::selection{background:var(--accent-soft)}
.outline{width:210px;flex:none;border-right:1px solid var(--line);background:var(--chrome);overflow-y:auto;padding:20px 10px 40px}
.outline h2{font-size:12px;font-weight:500;color:var(--muted);margin:0 8px 8px}
.outline a{display:block;padding:4px 8px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline a:hover{background:var(--line-soft)}
.outline a.l2{padding-left:18px}.outline a.l3{padding-left:28px;color:var(--muted)}
.outline .empty{color:var(--muted);font-size:12px;padding:4px 8px}
.stage{flex:1;overflow-y:auto;padding:32px 16px 30vh;scroll-behavior:auto}
.sheet{margin:0 auto;background:var(--sheet);border-radius:4px;box-shadow:var(--shadow);padding:clamp(28px,6vw,64px) clamp(20px,6vw,72px);width:fit-content;max-width:100%;position:relative}

/* the reading column */
.prose{font-family:var(--read-font);font-size:var(--fs);line-height:var(--lh);width:calc(var(--measure) * 1em);max-width:100%;text-align:var(--align);color:var(--ink);outline:none;overflow-wrap:break-word;
  font-feature-settings:"palt" 0;text-spacing-trim:space-first}
.prose.grid{background-image:
  linear-gradient(to right,var(--grid) 1px,transparent 1px),
  linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:1em calc(var(--lh) * 1em);background-position:0 0}
.prose > *:first-child{margin-top:0}
.prose p{margin:0 0 calc(var(--para) * 1em);text-indent:var(--indent)}
.prose h1,.prose h2,.prose h3,.prose h4,.prose h5,.prose h6{font-weight:700;line-height:1.3;text-wrap:balance;margin:1.4em 0 .5em;text-indent:0}
.prose h1{font-size:var(--h1);letter-spacing:.02em;margin-top:0}
.prose h2{font-size:var(--h2);padding-bottom:.25em;border-bottom:1px solid var(--line-soft)}
.prose h3{font-size:var(--h3)}.prose h4{font-size:var(--h4)}.prose h5,.prose h6{font-size:1em}
.prose a{color:var(--accent-text);text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px}
.prose strong{font-weight:700}
.prose mark{background:var(--mark);color:inherit;padding:0 .1em}
.prose ul,.prose ol{margin:0 0 calc(var(--para) * 1em);padding-left:1.6em}
.prose li{margin:.2em 0}
.prose li > p{margin:0;text-indent:0}
.prose li:has(> input[type=checkbox]){list-style:none;margin-left:-1.4em}
.prose input[type=checkbox]{width:.9em;height:.9em;margin:0 .45em 0 0;vertical-align:-.08em;accent-color:var(--accent);cursor:pointer}
.prose blockquote{margin:0 0 calc(var(--para) * 1em);padding:.1em 0 .1em 1em;border-left:3px solid var(--accent);color:var(--muted)}
.prose blockquote p{text-indent:0}
.prose code{font-family:var(--mono);font-size:.84em;background:var(--code-bg);padding:.12em .35em;border-radius:4px}
.prose pre{font-family:var(--mono);font-size:.8em;line-height:1.65;background:var(--code-bg);padding:1em 1.2em;border-radius:6px;overflow-x:auto;margin:0 0 calc(var(--para) * 1.2em);text-align:left}
.prose pre code{background:none;padding:0;font-size:1em}
.prose hr{border:0;height:1px;background:var(--line);margin:2em 0}
.prose table{display:block;overflow-x:auto;border-collapse:collapse;margin:0 0 calc(var(--para) * 1em);font-size:.9em;line-height:1.6;max-width:100%}
.prose th,.prose td{border:1px solid var(--line);padding:.4em .8em;text-align:left;vertical-align:top}
.prose th{background:var(--code-bg);font-weight:700}
.prose img{max-width:100%;border-radius:4px}

/* ---------- typeset panel ---------- */
.panel{width:290px;flex:none;border-left:1px solid var(--line);background:var(--chrome);overflow-y:auto;padding:18px 18px 40px}
.panel h2{font-size:15px;margin:0 0 2px;font-weight:600}
.panel .sub{color:var(--muted);font-size:12px;margin:0 0 16px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field .row{display:flex;justify-content:space-between;align-items:baseline}
.field label,.field .lbl{font-size:13px;font-weight:500}
.field output{font-size:12px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.field input[type=range]{width:100%;margin:0;height:24px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.field input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
.field input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.field input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--accent);border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--accent-text)}
.field input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--accent-text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px;min-height:30px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:500}
.chip.face-serif{font-family:"Noto Serif TC",serif}.chip.face-sans{font-family:"Noto Sans TC",sans-serif}.chip.face-kai{font-family:"LXGW WenKai TC",serif}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:12px;cursor:pointer}
.switch input{width:36px;height:20px;accent-color:var(--accent);cursor:pointer}
.panel hr{border:0;height:1px;background:var(--line);margin:18px 0}
.linkbtn{border:0;background:none;color:var(--accent-text);padding:0;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:.2em}

/* ---------- status bar ---------- */
.status{display:flex;gap:16px;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--chrome);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.status .grow{flex:1}

/* ---------- views ---------- */
.app[data-view="read"] .editor-pane{display:none}
.app[data-view="source"] .stage,.app[data-view="source"] .outline{display:none}
.app[data-view="split"] .outline{display:none}
.app[data-view="split"] .stage{flex:1}
.app:not([data-panel="open"]) .panel{display:none}

/* ---------- popover / toast / drop ---------- */
.pop{position:fixed;z-index:30;background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px;display:grid;gap:8px;width:min(320px,calc(100vw - 32px))}
.pop label{font-size:12px;color:var(--muted)}
.pop input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--sheet);width:100%}
.pop .row{display:flex;gap:6px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:48px;transform:translate(-50%,8px);background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.drop{position:fixed;inset:12px;border:2px dashed var(--accent-text);border-radius:14px;background:color-mix(in srgb,var(--ground) 88%,transparent);display:grid;place-items:center;z-index:50;font-size:16px;color:var(--accent-text);font-weight:500;pointer-events:none}

/* ---------- narrow screens ---------- */
@media (max-width:1100px){ .outline{display:none!important} }
@media (max-width:760px){
  .topbar{gap:8px;padding:8px 12px}
  .brand small{display:none}
  .filename{order:3;flex-basis:100%}
  .filename input{max-width:none}
  .actions .opt{display:none}
  .app[data-view="split"] .editor-pane{display:none}
  .seg button[data-view="split"]{display:none}
  .panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:70vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.15);z-index:20;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .stage{padding:16px 12px 40vh}
  .status .opt{display:none}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="app" id="app" data-view="split">
  <header class="topbar">
    <div class="brand">Markdown Viewer</div>
    <div class="filename">
      <input id="fname" value="使用說明.md" aria-label="檔名" spellcheck="false">
      <span class="dirty" id="dirty" hidden title="有尚未下載的修改"></span>
    </div>
    <div class="seg" role="group" aria-label="檢視模式">
      <button data-view="read" aria-pressed="false">閱讀</button>
      <button data-view="split" aria-pressed="true">分割</button>
      <button data-view="source" aria-pressed="false">原始碼</button>
    </div>
    <div class="actions">
      <button class="btn" id="openBtn" title="開啟 .md 檔（也可以直接拖曳檔案進來）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4.5V12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H8L6.5 3.5H3a1 1 0 0 0-1 1Z"/></svg>開啟</button>
      <button class="btn" id="panelBtn" aria-pressed="false" title="調整閱讀排版">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3h10M8 3v10M5.5 13h5"/></svg>排版</button>
      <button class="btn opt" id="copyBtn" title="複製全部 Markdown">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="8.5" height="8.5" rx="1.2"/><path d="M11 5V3.2A1.2 1.2 0 0 0 9.8 2H3.2A1.2 1.2 0 0 0 2 3.2v6.6A1.2 1.2 0 0 0 3.2 11H5"/></svg>複製</button>
      <button class="btn primary" id="saveBtn" title="下載為 .md 檔（Ctrl/⌘ + S）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>下載 .md</button>
    </div>
    <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" hidden>
  </header>

  <nav class="fmtbar" aria-label="文字格式">
    <button class="fbtn" data-cmd="h1" title="標題 1（Ctrl/⌘+Alt+1）"><span class="t">H1</span></button>
    <button class="fbtn" data-cmd="h2" title="標題 2（Ctrl/⌘+Alt+2）"><span class="t">H2</span></button>
    <button class="fbtn" data-cmd="h3" title="標題 3（Ctrl/⌘+Alt+3）"><span class="t">H3</span></button>
    <button class="fbtn" data-cmd="p" title="內文段落"><span class="t" style="font-weight:400">¶</span></button>
    <span class="sep"></span>
    <button class="fbtn" data-cmd="bold" title="粗體（Ctrl/⌘+B）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.5 2.8h4.2a2.6 2.6 0 0 1 0 5.2H4.5zM4.5 8h5a2.6 2.6 0 0 1 0 5.2h-5z"/></svg></button>
    <button class="fbtn" data-cmd="italic" title="斜體（Ctrl/⌘+I）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.8H6.5M9.5 13.2H6M8.8 2.8 7.2 13.2"/></svg></button>
    <button class="fbtn" data-cmd="strike" title="刪除線"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 8h11M11 4.5c-.4-1-1.5-1.7-3-1.7-1.8 0-3 .9-3 2.2M5 11.3c.4 1.1 1.6 1.9 3.2 1.9 1.9 0 3.1-.9 3.1-2.3"/></svg></button>
    <button class="fbtn" data-cmd="code" title="行內程式碼"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg></button>
    <button class="fbtn" data-cmd="link" title="連結（Ctrl/⌘+K）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.8 9.2a2.8 2.8 0 0 0 4 0l2-2a2.8 2.8 0 0 0-4-4l-.7.7M9.2 6.8a2.8 2.8 0 0 0-4 0l-2 2a2.8 2.8 0 0 0 4 4l.7-.7"/></svg></button>
    <span class="sep"></span>
    <button class="fbtn" data-cmd="ul" title="項目清單"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4h8M6 8h8M6 12h8"/><circle cx="2.8" cy="4" r=".9" fill="currentColor"/><circle cx="2.8" cy="8" r=".9" fill="currentColor"/><circle cx="2.8" cy="12" r=".9" fill="currentColor"/></svg></button>
    <button class="fbtn" data-cmd="ol" title="編號清單"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 4h7.5M6.5 8h7.5M6.5 12h7.5"/><text x="1.2" y="5.6" font-size="4.6" fill="currentColor" stroke="none" font-family="sans-serif">1</text><text x="1.2" y="9.6" font-size="4.6" fill="currentColor" stroke="none" font-family="sans-serif">2</text><text x="1.2" y="13.6" font-size="4.6" fill="currentColor" stroke="none" font-family="sans-serif">3</text></svg></button>
    <button class="fbtn" data-cmd="task" title="待辦清單"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="11" height="11" rx="2"/><path d="m4.8 8 2 2 3.7-4"/></svg></button>
    <button class="fbtn" data-cmd="quote" title="引言"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v10M6.5 5h7M6.5 8h7M6.5 11h5"/></svg></button>
    <button class="fbtn" data-cmd="codeblock" title="程式碼區塊"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.8" y="2.5" width="12.4" height="11" rx="1.6"/><path d="m5.3 6.5-1.6 1.5 1.6 1.5M8 10.5h3"/></svg></button>
    <button class="fbtn" data-cmd="table" title="插入表格"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="1.4"/><path d="M2 6.3h12M2 9.9h12M6.3 2.5v11"/></svg></button>
    <button class="fbtn" data-cmd="hr" title="分隔線"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8h12"/><path d="M4 4.5h8M4 11.5h8" stroke-opacity=".35"/></svg></button>
    <span class="target" id="target">套用在 <b>原始碼</b></span>
  </nav>

  <main class="work">

  r.setProperty('--fs', ts.fs+'px');
  r.setProperty('--lh', ts.lh);
  r.setProperty('--measure', ts.measure);
  r.setProperty('--para', ts.para);
  r.setProperty('--align', ts.align);
  r.setProperty('--indent', ts.indent ? '2em' : '0em');
  r.setProperty('--h1', (sc**4).toFixed(4)+'em'); r.setProperty('--h2', (sc**3).toFixed(4)+'em');
  r.setProperty('--h3', (sc**2).toFixed(4)+'em'); r.setProperty('--h4', sc+'em');
  view.classList.toggle('grid', !!ts.grid);
  if(ts.theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', ts.theme);
  $('#fs').value=ts.fs; $('#fsOut').textContent = ts.fs+' px';
  $('#lh').value=ts.lh; $('#lhOut').textContent = (+ts.lh).toFixed(2)+' 倍';
  $('#measure').value=ts.measure; $('#measureOut').textContent = ts.measure+' 字';
  $('#para').value=ts.para; $('#paraOut').textContent = (+ts.para).toFixed(1)+' 字高';
  $('#indent').checked=ts.indent; $('#grid').checked=ts.grid;
  document.querySelectorAll('.chips').forEach(g=>g.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', String(ts[g.dataset.set])===c.dataset.v)));
  store.set('ts', ts);
}
['fs','lh','measure','para'].forEach(id=>{
  const el = $('#'+id);
  el.addEventListener('input', ()=>{ ts[id] = +el.value; applyTs(); });
  if(id==='measure'){ // show manuscript grid while dragging width
    el.addEventListener('pointerdown', ()=>view.classList.add('grid'));
    const off = ()=>view.classList.toggle('grid', !!ts.grid);
    el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('blur', off);
  }
});
document.querySelectorAll('.chips').forEach(g=>g.addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return; ts[g.dataset.set] = c.dataset.v; applyTs();
}));
$('#indent').onchange = e=>{ ts.indent = e.target.checked; applyTs(); };
$('#grid').onchange = e=>{ ts.grid = e.target.checked; applyTs(); };
$('#resetBtn').onclick = ()=>{ const th = ts.theme; ts = Object.assign({}, DEFAULTS, {theme:th}); applyTs(); toast('已還原預設排版'); };
function setPanel(open){
  app.dataset.panel = open ? 'open' : '';
  $('#panelBtn').setAttribute('aria-pressed', open);
  store.set('panel', open);
}
$('#panelBtn').onclick = ()=>setPanel(app.dataset.panel!=='open');

/* ---------- open / drop ---------- */
function loadText(text, name){
  src.value = text.replace(/\r\n?/g,'\n');
  if(name) $('#fname').value = name;
  savedText = src.value;
  render(); persist(); cursorInfo();
  stage.scrollTop = 0; src.scrollTop = 0;
  toast('已開啟 ' + (name || '檔案'));
}
function readFile(f){
  if(!f) return;
  if(!/\.(md|markdown|mdown|txt)$/i.test(f.name) && f.type && !/^text\//.test(f.type)){ toast('這不是 Markdown 或純文字檔，請選擇 .md 檔'); return; }
  const r = new FileReader();
  r.onload = ()=>loadText(r.result, f.name);
  r.onerror = ()=>toast('讀不到這個檔案，請再試一次');
  r.readAsText(f);
}
$('#openBtn').onclick = ()=>$('#fileInput').click();
$('#fileInput').onchange = e=>{ readFile(e.target.files[0]); e.target.value=''; };
let dragDepth = 0;
addEventListener('dragenter', e=>{ if([...e.dataTransfer.types].includes('Files')){ dragDepth++; $('#drop').hidden=false; } });
addEventListener('dragleave', ()=>{ if(--dragDepth<=0){ dragDepth=0; $('#drop').hidden=true; } });
addEventListener('dragover', e=>e.preventDefault());
addEventListener('drop', e=>{ e.preventDefault(); dragDepth=0; $('#drop').hidden=true; readFile(e.dataTransfer.files[0]); });

/* ---------- save / copy / export ---------- */
let downloads = null;
const standalone = !(window.claude && typeof window.claude.use === 'function');
function mdName(){ let n = $('#fname').value.trim() || '未命名.md'; if(!/\.(md|markdown)$/i.test(n)) n = n.replace(/\.[^.]*$/,'') + '.md'; return n; }
function blobSave(filename, data, type){
  const url = URL.createObjectURL(new Blob([data], {type}));
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function saveMd(){
  if(standalone){ blobSave(mdName(), src.value, 'text/markdown;charset=utf-8'); savedText = src.value; stats(); toast('已下載 ' + mdName()); return; }
  if(!downloads){ return copyMd('無法在這裡下載檔案，已改為複製 Markdown'); }
  try{
    await downloads.save({ filename: mdName(), data: src.value });
    savedText = src.value; stats(); toast('已下載 ' + mdName());
  }catch(err){
    if(err && err.code==='declined') return;
    if(err && err.code==='rate_limited'){ toast('下載視窗已經開著'); return; }
    copyMd('無法下載，已改為複製 Markdown');
  }
}
async function copyMd(msg){
  try{ await navigator.clipboard.writeText(src.value); toast(msg || '已複製 Markdown'); }
  catch(e){ setView(app.dataset.view==='read' ? 'split' : app.dataset.view); src.focus(); src.select(); toast('已選取全部內容，按 Ctrl/⌘ + C 複製'); }
}
$('#saveBtn').onclick = saveMd;
$('#copyBtn').onclick = ()=>copyMd();

function exportHtml(){
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  const title = (view.querySelector('h1')||{}).textContent || mdName().replace(/\.\w+$/,'');
  const css = `body{margin:0;background:#fff;color:#1C1F25}
main{font-family:${FACES[ts.face]};font-size:${ts.fs}px;line-height:${ts.lh};max-width:${ts.measure}em;margin:0 auto;padding:64px 20px;text-align:${ts.align}}
p{margin:0 0 ${ts.para}em;text-indent:${ts.indent?'2em':'0'}}
h1,h2,h3,h4{line-height:1.3;margin:1.4em 0 .5em}h1{font-size:${v('--h1')};margin-top:0}h2{font-size:${v('--h2')};padding-bottom:.25em;border-bottom:1px solid #E6E9ED}h3{font-size:${v('--h3')}}h4{font-size:${v('--h4')}}
a{color:#5C6059}ul,ol{padding-left:1.6em;margin:0 0 ${ts.para}em}li>p{margin:0}li:has(>input[type=checkbox]){list-style:none;margin-left:-1.4em}
blockquote{margin:0 0 ${ts.para}em;padding-left:1em;border-left:3px solid #BDC0BA;color:#5F6673}blockquote p{text-indent:0}
code{font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:.84em;background:#F1F3F5;padding:.12em .35em;border-radius:4px}
pre{background:#F1F3F5;padding:1em 1.2em;border-radius:6px;overflow-x:auto;font-size:.8em}pre code{padding:0;background:none;font-size:1em}
table{border-collapse:collapse;display:block;overflow-x:auto;font-size:.9em}th,td{border:1px solid #D5D9E0;padding:.4em .8em;text-align:left}th{background:#F1F3F5}
hr{border:0;height:1px;background:#D5D9E0;margin:2em 0}img{max-width:100%}`;
  const body = mdToHtml(src.value);
  const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  return `<!doctype html>\n<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&family=JetBrains+Mono&display=swap">\n<style>${css}</style></head><body><main>\n${body}\n</main></body></html>`;
}
$('#exportBtn').onclick = async ()=>{
  const name = mdName().replace(/\.(md|markdown)$/i,'.html');
  if(standalone){ blobSave(name, exportHtml(), 'text/html;charset=utf-8'); toast('已匯出 ' + name); return; }
  if(!downloads){ toast('這個檢視無法下載檔案'); return; }
  try{ await downloads.save({ filename:name, data: exportHtml() }); toast('已匯出 ' + name); }
  catch(err){ if(err && err.code!=='declined') toast('匯出失敗，請再試一次'); }
};

/* ---------- misc ---------- */
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2200); }
$('#fname').addEventListener('input', persist);

/* ---------- boot ---------- */
const draft = store.get('doc');
if(draft && typeof draft.text==='string'){ src.value = draft.text; if(draft.name) $('#fname').value = draft.name; $('#stSaved').textContent='已載入上次的暫存'; }
else { src.value = SAMPLE; $('#stSaved').textContent='範例文件'; }
savedText = src.value;
const narrow = matchMedia('(max-width:760px)').matches;
setView(store.get('view') || (narrow ? 'read' : 'split'));
if(narrow && app.dataset.view==='split') setView('read');
setPanel(store.get('panel') ?? !narrow);
applyTs(); render(); cursorInfo();
setTarget(app.dataset.view==='read' ? 'view' : 'editor');

if(window.claude && typeof claude.use==='function'){
  claude.use('downloads').then(d=>{ downloads = d; if(!d){ $('#saveBtn').lastChild.textContent='複製 Markdown'; $('#exportBtn').hidden=true; } });
}
})();
</script>

</body>
</html>
